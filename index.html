<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Club ✨</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <!-- Cute rounded Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #fff5f8; /* Soft pastel pink */
            background-image: radial-gradient(#ffc2d4 1.5px, transparent 1.5px);
            background-size: 24px 24px; /* Subtle polka-dot pattern */
            font-family: 'Quicksand', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 14px;
            padding: 20px;
        }

        h3 {
            color: #d63384;
            font-weight: 700;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            max-width: 310px;
            padding: 12px 18px;
            border: 2px solid #ffc2d4;
            border-radius: 50px; /* Pill shape */
            background-color: #ffffff;
            color: #592e41;
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #d49bb0;
            font-weight: 500;
        }

        input:focus {
            border-color: #ff758f;
            box-shadow: 0 4px 12px rgba(255, 117, 143, 0.2);
        }

        #recalculate {
            width: 100%;
            max-width: 310px;
            padding: 12px;
            border: none;
            border-radius: 50px;
            background-color: #ff758f;
            color: white;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #e05772; /* Cute 3D button bottom */
            transition: all 0.15s ease;
            margin-top: 4px;
        }

        #recalculate:hover {
            background-color: #ff5c7c;
        }

        #recalculate:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #e05772;
        }

        #message {
            max-width: 310px;
            text-align: center;
            color: #b51763;
            background-color: #ffe3ec;
            padding: 10px 18px;
            border-radius: 20px;
            margin-top: 8px;
            font-weight: 600;
        }

        #message:empty {
            display: none;
        }
    </style>
</head>
<body>
    
    <h3>🌸 English Club 🌸</h3>

    <input type="text" placeholder="First name..." id="firstname">
    <input type="text" placeholder="Surname..." id="surname">

    <button id="recalculate" py-click="show_result">Add Member ✨</button>

    <p id="message"></p>

    <py-script src="main.py"></py-script>

</body>
</html>
